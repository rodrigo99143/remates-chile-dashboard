name: Correr barrido de remates

# "workflow_dispatch" es lo que hace aparecer el botón "Run workflow" en la
# pestaña "Actions" de GitHub. Cualquiera con acceso al repositorio lo puede
# apretar desde el navegador, sin VS Code y sin tener el computador prendido.
on:
  workflow_dispatch: {}

jobs:
  barrido:
    runs-on: ubuntu-latest
    # Tope de seguridad: si algo se cuelga, que no corra para siempre.
    timeout-minutes: 180
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar las bibliotecas necesarias
        run: pip install -r requirements.txt

      - name: Instalar el navegador (Chromium) para Macal y Poder Judicial
        run: python -m playwright install --with-deps chromium

      - name: Descargar el catastro del SII (desde un Release del repositorio)
        # El catastro pesa demasiado para guardarlo directo en el repositorio,
        # así que se sube como adjunto a un "Release" llamado "catastro-sii"
        # (github.com/.../releases) y aquí se descarga antes de correr el
        # programa. Si todavía no existe ese Release, este paso simplemente
        # no encuentra nada y el programa sigue sin catastro, como antes.
        run: |
          mkdir -p datos
          gh release download catastro-sii --repo rodrigo99143/remates-chile-dashboard --pattern "BRORGA*" --dir datos --clobber || echo "  (Todavía no hay un Release 'catastro-sii' con el catastro. Sigo sin él.)"
          for z in datos/*.zip; do
            [ -f "$z" ] || continue
            echo "  Descomprimiendo $z ..."
            unzip -o "$z" -d datos/
            rm -f "$z"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Correr el programa
        # El programa está hecho para seguir funcionando igual aunque falte
        # el catastro o los avisos .docx (esos .docx solo existen en el Mac
        # de Rodrigo todavía) - entrega lo que puede con TGR, Macal, precio
        # de mercado y Poder Judicial, que buscan todo solos desde internet.
        run: python remates_v2.py
        continue-on-error: true

      - name: Enviar el correo con el resumen y el Excel adjunto
        if: always()
        run: python enviar_correo.py
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CORREO_DESDE: rbastias1991@gmail.com
          CORREO_PARA: rbastias1991@gmail.com
        continue-on-error: true

      - name: Guardar los resultados (Excel, CSV y el registro) para descargar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-remates
          path: salidas/
          if-no-files-found: warn
          retention-days: 30
