name: Correr barrido de remates

# "workflow_dispatch" es lo que hace aparecer el botón "Run workflow" en la
# pestaña "Actions" de GitHub. Cualquiera con acceso al repositorio lo puede
# apretar desde el navegador, sin VS Code y sin tener el computador prendido.
on:
  workflow_dispatch:
    inputs:
      sembrar_baseline:
        description: >-
          SOLO para la corrida de validación del 2026-10-20: si es "true",
          antes de correr el programa se siembra candidatas_historico con la
          línea base acordada (corrida del 13-10 22:12), para que "nuevo" se
          calcule contra esa fecha. En corridas normales se deja en "false".
        type: boolean
        default: false

jobs:
  barrido:
    runs-on: ubuntu-latest
    # Tope de seguridad: si algo se cuelga, que no corra para siempre.
    timeout-minutes: 180
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar las bibliotecas necesarias
        run: pip install -r requirements.txt

      - name: Instalar el navegador (Chromium) para Macal y Poder Judicial
        run: python -m playwright install --with-deps chromium

      - name: Descargar el catastro del SII (desde un Release del repositorio)
        # El catastro pesa demasiado para guardarlo directo en el repositorio,
        # así que se sube como adjunto a un "Release" llamado "catastro-sii"
        # (github.com/.../releases) y aquí se descarga antes de correr el
        # programa. Si todavía no existe ese Release, este paso simplemente
        # no encuentra nada y el programa sigue sin catastro, como antes.
        run: |
          mkdir -p datos
          gh release download catastro-sii --repo rodrigo99143/remates-chile-dashboard --pattern "BRORGA*" --dir datos --clobber || echo "  (Todavía no hay un Release 'catastro-sii' con el catastro. Sigo sin él.)"
          for z in datos/*.zip; do
            [ -f "$z" ] || continue
            echo "  Descomprimiendo $z ..."
            unzip -o "$z" -d datos/
            rm -f "$z"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Descargar la base de precios de mercado (desde un Release del repositorio)
        # Igual que el catastro: "precio_mercado.db" se va llenando con meses de
        # trabajo (el barrido diario chico + el barrido nacional cada 6 meses).
        # Se sube como adjunto a un Release llamado "precio-mercado" para que la
        # nube no tenga que empezar siempre de cero. Si no existe ese Release
        # todavía, este paso no hace nada y el programa sigue igual que antes.
        run: |
          mkdir -p datos
          gh release download precio-mercado --repo rodrigo99143/remates-chile-dashboard --pattern "precio_mercado.db" --dir datos --clobber || echo "  (Todavía no hay un Release 'precio-mercado'. Empiezo la base de datos de mercado desde cero.)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Sembrar línea base de candidatas (solo validación 2026-10-20)
        # Paso de una sola vez: solo corre si se dispara el workflow con
        # "sembrar_baseline" = true. Ver sembrar_historico.py para el detalle.
        if: inputs.sembrar_baseline == true
        run: |
          mkdir -p datos
          python sembrar_historico.py datos/precio_mercado.db semillas/seed_candidatas_2026-10-13.csv

      - name: Correr el programa
        # El programa está hecho para seguir funcionando igual aunque falte
        # el catastro o los avisos .docx (esos .docx solo existen en el Mac
        # de Rodrigo todavía) - entrega lo que puede con TGR, Macal, precio
        # de mercado y Poder Judicial, que buscan todo solos desde internet.
        #
        # OJO (2026-10-27): este paso tenía "continue-on-error: true", igual
        # que el de "Enviar el correo". Mismo problema: si remates_v2.py se
        # cae con una excepción de verdad (termina con código de error), ese
        # flag hacía que GitHub Actions igual mostrara el paso en verde
        # ("success"), ocultando la falla real. Los pasos siguientes ya
        # tienen "if: always()", así que de todas formas siguen corriendo
        # aunque este paso falle - lo que cambia es que ahora SÍ queda
        # visible si el programa se cae antes de llegar a generar el Excel
        # (que es, justamente, lo que explicaría por qué "enviar_correo.py"
        # no encuentra el Excel y nunca llega a intentar mandar el correo).
        run: python remates_v2.py

      - name: Enviar el correo con el resumen y el Excel adjunto
        # OJO (2026-10-27): este paso NO lleva "continue-on-error: true" a
        # propósito. Con ese flag puesto, GitHub Actions siempre reporta este
        # paso como "success" (verde) para quien mira la corrida desde afuera
        # - aunque el script internamente termine con código de error -,
        # porque "continue-on-error" pisa el resultado real ("outcome") y lo
        # reemplaza por "success" en el campo "conclusion". Eso es justo lo
        # que impidió detectar, durante una semana, que el correo de
        # resultados dejó de enviarse: el paso siempre se veía en verde. Los
        # pasos que vienen después ya tienen "if: always()", así que siguen
        # corriendo igual aunque este paso falle de verdad - lo único que
        # cambia es que ahora SÍ queda visible (rojo) si el envío falla.
        if: always()
        run: python enviar_correo.py
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CORREO_DESDE: rbastias1991@gmail.com
          CORREO_PARA: rbastias1991@gmail.com

      - name: Guardar los cambios de hoy en la base de precios de mercado (para la próxima corrida)
        # Así la nube va quedando cada vez más completa sola, sin que Rodrigo
        # tenga que volver a subir el archivo a mano cada vez.
        if: always()
        run: |
          if [ -f datos/precio_mercado.db ]; then
            gh release upload precio-mercado datos/precio_mercado.db --repo rodrigo99143/remates-chile-dashboard --clobber || \
            gh release create precio-mercado datos/precio_mercado.db --repo rodrigo99143/remates-chile-dashboard --title "precio-mercado" --notes "Base de precios de mercado (se actualiza sola en cada corrida)."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Guardar los resultados (Excel, CSV y el registro) para descargar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-remates
          path: salidas/
          if-no-files-found: warn
          retention-days: 30

      - name: Guardar las capturas de pantalla del Poder Judicial (solo si algo falló, para revisarlo)
        # Si una consulta al Poder Judicial falla, el programa guarda una captura de
        # pantalla de en qué paso se atascó. Normalmente no hay nada que guardar aquí
        # (si todo salió bien, esta carpeta queda vacía).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-poder-judicial
          path: debug_pjud/
          if-no-files-found: ignore
          retention-days: 7
